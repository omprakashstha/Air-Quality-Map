<!DOCTYPE html>
<html>
<head>
<title>Nova Scotia Air Quality Monitoring System</title>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { margin:0; font-family: Arial; background:#1e1e2f; color:white; }
  #map { height:100vh; }
  .header { background:#111; color:white; padding:12px; text-align:center; font-size:20px; position:fixed; width:100%; z-index:1000; }
  .sensor-label {
    background: white; border: 1px solid #333; padding: 2px 6px; font-size: 12px; border-radius: 4px; color:black;
  }
  select { background:#333; color:white; border:none; padding:5px; border-radius:4px; width:100%; margin-bottom:5px; }
</style>
</head>
<body>
<div class="header">🌍 Smart Sydney Air Quality Monitoring Platform</div>
<div id="map"></div>

<script>
const channels = [
  { id: "3244898", name: "Kings Road, Sydney AQI" },
  { id: "CHANNEL_ID_2", name: "Pokhara AQ Station" }
];

const map = L.map('map').setView([0,0],2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
 attribution:'© OpenStreetMap'
}).addTo(map);

let markers = {};
let bounds = [];

// AQI from PM2.5
function calculateAQI(pm) {
  if(pm <= 12) return {aqi: pm*4.16, level:"Good", color:"#2ecc71"};
  if(pm <= 35.4) return {aqi: 50 + (pm-12)*2.1, level:"Moderate", color:"#f1c40f"};
  if(pm <= 55.4) return {aqi: 100 + (pm-35.4)*2.46, level:"Unhealthy (Sensitive)", color:"#e67e22"};
  if(pm <= 150.4) return {aqi: 150 + (pm-55.4)*0.52, level:"Unhealthy", color:"#e74c3c"};
  return {aqi: 300, level:"Hazardous", color:"#8e44ad"};
}

// Online/offline
function getStatus(lastUpdate){
  const diff = (new Date() - new Date(lastUpdate))/60000;
  return diff <= 2 ? {text:"ONLINE", color:"green"} : {text:"OFFLINE", color:"red"};
}

// Fetch latest sensor data
function fetchData(sensor){
  const channelID = sensor.id;
  const sensorName = sensor.name;

  fetch(`https://api.thingspeak.com/channels/${channelID}/feeds.json?results=1`)
    .then(res => res.json())
    .then(data => {
      const latest = data.feeds[0];
      if(!latest) return;
      const lat = parseFloat(latest.field7);
      const lon = parseFloat(latest.field8);
      if(isNaN(lat) || isNaN(lon)) return;

      const pm25 = parseFloat(latest.field2);
      const lastUpdate = latest.created_at;
      const aqiData = calculateAQI(pm25);
      const status = getStatus(lastUpdate);

      if(!markers[channelID]){
        markers[channelID] = L.circleMarker([lat, lon], {
          radius:15, fillColor:aqiData.color, color:"#000", weight:1, fillOpacity:0.9
        }).addTo(map);

        markers[channelID].bindTooltip(sensorName, {permanent:true, direction:"top", offset:[0,-10], className:"sensor-label"});
        bounds.push([lat, lon]);
        map.fitBounds(bounds, {padding:[50,50]});
      } else {
        markers[channelID].setLatLng([lat, lon]);
        markers[channelID].setStyle({fillColor:aqiData.color});
      }

      // Popup with big AQI-only graph
      markers[channelID].bindPopup(`
        <div style="width:500px;">
          <b>${sensorName}</b><br>
          <b>Channel:</b> ${channelID}<br>
          <b>Status:</b> <span style="color:${status.color}">${status.text}</span><br>
          <b>PM2.5:</b> ${pm25} µg/m³<br>
          <b>AQI:</b> ${aqiData.aqi.toFixed(0)} (${aqiData.level})<br><br>
          <select id="time-range-${channelID}">
            <option value="1">1 Hour</option>
            <option value="24">24 Hours</option>
            <option value="168">7 Days</option>
          </select>
          <canvas id="chart-${channelID}" width="480" height="300"></canvas>
        </div>
      `);

      markers[channelID].on('popupopen', ()=>{
        loadAQIChart(channelID, document.getElementById(`time-range-${channelID}`).value);
        document.getElementById(`time-range-${channelID}`).addEventListener('change', e=>{
          loadAQIChart(channelID, e.target.value);
        });
      });
    });
}

// Load AQI-only chart
function loadAQIChart(channelID, hours){
  const results = Math.min(hours*4, 1000);
  fetch(`https://api.thingspeak.com/channels/${channelID}/feeds.json?results=${results}`)
    .then(res => res.json())
    .then(history=>{
      const labels = history.feeds.map(f=>new Date(f.created_at).toLocaleTimeString());
      const aqiData = history.feeds.map(f=>calculateAQI(parseFloat(f.field2)||0).aqi);

      const ctx = document.getElementById(`chart-${channelID}`).getContext('2d');
      if(window[`chart_${channelID}`]) window[`chart_${channelID}`].destroy();

      window[`chart_${channelID}`] = new Chart(ctx, {
        type:'line',
        data:{
          labels:labels,
          datasets:[{
            label:'AQI',
            data:aqiData,
            borderColor:'#8e44ad',
            backgroundColor:'rgba(142,68,173,0.2)',
            fill:true,
            tension:0.3,
            pointRadius:4,
            pointBackgroundColor:'#fff',
            pointBorderColor:'#8e44ad'
          }]
        },
        options:{
          responsive:false,
          plugins:{
            legend:{ labels:{color:'white'} },
            tooltip:{mode:'index', intersect:false}
          },
          scales:{
            x:{ title:{display:true,text:'Time', color:'white'}, ticks:{color:'white'}, grid:{color:'rgba(255,255,255,0.2)'} },
            y:{ title:{display:true,text:'AQI', color:'white'}, ticks:{color:'white'}, grid:{color:'rgba(255,255,255,0.2)'} }
          }
        }
      });
    });
}

// Initial load
channels.forEach(sensor=>fetchData(sensor));
setInterval(()=>channels.forEach(sensor=>fetchData(sensor)),15000);
</script>
</body>
</html>
