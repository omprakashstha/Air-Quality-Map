<!DOCTYPE html>
<html>
<head>
<title>Nova Scotia Air Quality Monitoring System</title>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { margin:0; font-family: Arial; background:#1e1e2f; color:white; }
#map { height:100vh; }
.header { background:#111; padding:12px; text-align:center; font-size:20px; }

.sensor-label {
  background:white;
  border:1px solid #333;
  padding:2px 6px;
  font-size:12px;
  border-radius:4px;
  color:black;
}

.leaflet-popup-content-wrapper{
  background:white!important;
  color:black!important;
  min-width:800px!important;
  max-width:800px!important;
}
.leaflet-popup-content{ margin:0!important; padding:0!important; }

.popup-container{ padding-top:12px }
.popup-title{ text-align:center; font-weight:bold; font-size:23px; padding-top:12px; }

.popup-flex{ display:flex; gap:20px; padding:18px; }

.popup-details{ width:220px; font-size:15px; }
.popup-details b{ display:block; margin-top:10px; }

.popup-chart{ flex:1; background:#fff; padding:14px; border-radius:6px; margin-left: 8px;}

canvas{ background:#fff; }

button, select{
  width:100%;
  margin-top:9px;
  padding:7px;
}
.status-online{ color:green; font-weight:bold }
.status-offline{ color:red; font-weight:bold }
</style>
</head>

<body>
<div class="header">🌍 Sydney Air Quality Monitoring Platform</div>
<div id="map"></div>

<script>
/* ---------------- CONFIG ---------------- */
const channels=[
 {id:"3244898",name:"Kings Road, Sydney AQI",lat:46.121921,lon:-60.204464},
 {id:"3253969",name:"Shivam AQI",lat:46.138502,lon:-60.181787},
 {id:"3280999",name:"Ashby AQI",lat:46.133050,lon:-60.173377}
];

const map=L.map('map').setView([46.12,-60.19],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let markers={}, charts={}, historyCache={}, metaCache={};

/* ---------------- AQI ---------------- */
function calculateAQI(pm){
 if(pm<=12) return {aqi:pm*4.16,level:"Good",color:"#2ecc71"};
 if(pm<=35.4) return {aqi:50+(pm-12)*2.1,level:"Moderate",color:"#f1c40f"};
 if(pm<=55.4) return {aqi:100+(pm-35.4)*2.46,level:"Unhealthy (Sensitive)",color:"#e67e22"};
 return {aqi:200,level:"Unhealthy",color:"#e74c3c"};
}

/* ---------------- AQHI ---------------- */
function calculateAQHI(pm){
 let v=pm<=10?1+(pm/10)*2:
       pm<=20?3+((pm-10)/10)*3:
       pm<=30?6+((pm-20)/10)*4:10;
 v=Math.round(Math.min(10,Math.max(1,v)));
 return {aqhi:v,risk:v<=3?"Low":v<=6?"Moderate":v<=9?"High":"Very High"};
}

/* ---------------- STATUS ---------------- */
function getStatus(ts){
 const mins=(Date.now()-new Date(ts))/60000;
 return mins<=15
  ?{text:"ONLINE",cls:"status-online"}
  :{text:"OFFLINE",cls:"status-offline"};
}

/* ---------------- POPUP ---------------- */
function getPopupHTML(s,pm25,aqi,aqhi,status){
 metaCache[s.id]={s,pm25,aqi,aqhi,status};

 return `
 <div class="popup-container">
  <div class="popup-title">${s.name}</div>
  <div class="popup-flex">
   <div class="popup-details">
    <b>Status:</b> <span class="${status.cls}">${status.text}</span>
    <b>Channel:</b> ${s.id}
    <b>PM2.5:</b> ${pm25.toFixed(1)} µg/m³
    <b>US AQI:</b> ${aqi.aqi.toFixed(0)} (${aqi.level})
    <b>Canada AQHI:</b> ${aqhi.aqhi} (${aqhi.risk})

    <select onchange="loadChart('${s.id}',this.value)">
      <option value="1">1 Hour</option>
      <option value="12">12 Hours</option>
      <option value="24" selected>24 Hours</option>
      <option value="72">3 Days</option>
      <option value="168">7 Days</option>
    </select>

    <button onclick="exportCSV('${s.id}')">Export CSV</button>
    <button onclick="exportPDF('${s.id}')">Export PDF</button>
   </div>

   <div class="popup-chart">
    <canvas id="chart-${s.id}" width="650" height="350"></canvas>
   </div>
  </div>
 </div>`;
}

/* ---------------- FETCH ---------------- */
function fetchData(sensor){
 fetch(`https://api.thingspeak.com/channels/${sensor.id}/feeds.json?results=1`)
 .then(r=>r.json()).then(d=>{
  const f=d.feeds[0]; if(!f) return;

  const pm25=parseFloat(f.field2)||0;
  const aqi=calculateAQI(pm25);
  const aqhi=calculateAQHI(pm25);
  const status=getStatus(f.created_at);

  if(!markers[sensor.id]){
    markers[sensor.id]=L.circleMarker([sensor.lat,sensor.lon],{
      radius:15,fillColor:aqi.color,color:"#000",fillOpacity:0.9
    }).addTo(map)
     .bindTooltip(sensor.name,{permanent:true,className:"sensor-label"})
     .bindPopup(getPopupHTML(sensor,pm25,aqi,aqhi,status))
     .on('popupopen',()=>loadChart(sensor.id,24));
  }else{
    markers[sensor.id].setStyle({fillColor:aqi.color});
  }
 });
}

/* ---------------- CHART ---------------- */
function loadChart(id,hours){
 const points=Math.min(hours*6,1000);
 fetch(`https://api.thingspeak.com/channels/${id}/feeds.json?results=${points}`)
 .then(r=>r.json()).then(h=>{
  historyCache[id]=h.feeds;

  const labels=h.feeds.map(f=>
    new Date(f.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
  );

  const pm25=h.feeds.map(f=>{
    const v=parseFloat(f.field2);
    return isNaN(v)?null:v;
  });

  if(charts[id]) charts[id].destroy();

  charts[id]=new Chart(document.getElementById(`chart-${id}`),{
    type:'line',
    data:{labels,datasets:[{
      label:'PM2.5 (µg/m³)',
      data:pm25,
      borderColor:'#e74c3c',
      tension:0.3,
      spanGaps:true,
      pointRadius:3
    }]},
    options:{responsive:true,maintainAspectRatio:false}
  });
 });
}

/* ---------------- EXPORT ---------------- */
function exportCSV(id){
 let csv="Time,PM2.5\n";
 historyCache[id].forEach(f=>csv+=`${f.created_at},${f.field2}\n`);
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
 a.download=`AQI_${id}.csv`;
 a.click();
}

function exportPDF(id){
 const {jsPDF}=window.jspdf;
 const pdf=new jsPDF();
 const m=metaCache[id];
 const img=document.getElementById(`chart-${id}`).toDataURL();

 pdf.text(m.s.name,15,15);
 pdf.text(`Status: ${m.status.text}`,15,25);
 pdf.text(`PM2.5: ${m.pm25.toFixed(1)} µg/m³`,15,32);
 pdf.text(`US AQI: ${m.aqi.aqi.toFixed(0)} (${m.aqi.level})`,15,39);
 pdf.text(`Canada AQHI: ${m.aqhi.aqhi} (${m.aqhi.risk})`,15,46);
 pdf.addImage(img,'PNG',15,55,180,90);
 pdf.save(`${m.s.name}_AQ_Report.pdf`);
}

/* ---------------- INIT ---------------- */
channels.forEach(fetchData);
setInterval(()=>channels.forEach(fetchData),600000);
</script>
</body>
</html>
