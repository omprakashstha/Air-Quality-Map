<!DOCTYPE html>
<html>
<head>
<title>Professional Air Quality Platform</title>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { margin:0; font-family: Arial; background:#1e1e2f; color:white; }
  #map { height:100vh; }
  .header { background:#111; color:white; padding:12px; text-align:center; font-size:20px; }
  .sensor-label { background: white; border: 1px solid #333; padding: 2px 6px; font-size: 12px; border-radius: 4px; color:black; }
  .leaflet-popup-content-wrapper { background: white !important; color: black !important; min-width: 520px !important; max-width: 520px !important; box-shadow: 0 4px 15px rgba(0,0,0,0.25); }
  .leaflet-popup-content { margin: 0 !important; padding: 0 !important; }
  .popup-flex { display: flex; gap: 20px; padding: 15px; }
  .popup-details { flex: 1 1 160px; font-size: 14px; line-height: 1.4; font-weight: 600; }
  .popup-details b { display:block; margin-top:8px; }
  .popup-chart { flex: 2 1 340px; background: white; padding: 10px; border-radius: 6px; }
  select { width: 100%; margin-bottom: 10px; padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
</style>
</head>
<body>
<div class="header">
 🌍 Smart Multi-City Air Quality Monitoring Platform
</div>
<div id="map"></div>

<script>
const channels = [
  { id: "3244898", name: "Kings Road, Sydney AQI" },
  { id: "CHANNEL_ID_2", name: "Pokhara AQ Station" }
];

var map = L.map('map').setView([0,0],2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap' }).addTo(map);

let markers = {};
let bounds = [];

function calculateAQI(pm) {
  if(pm <= 12) return {aqi: pm*4.16, level:"Good", color:"#2ecc71"};
  if(pm <= 35.4) return {aqi: 50 + (pm-12)*2.1, level:"Moderate", color:"#f1c40f"};
  if(pm <= 55.4) return {aqi: 100 + (pm-35.4)*2.46, level:"Unhealthy (Sensitive)", color:"#e67e22"};
  if(pm <= 150.4) return {aqi: 150 + (pm-55.4)*0.52, level:"Unhealthy", color:"#e74c3c"};
  return {aqi: 300, level:"Hazardous", color:"#8e44ad"};
}

function getStatus(lastUpdate){
  const now = new Date();
  const updateTime = new Date(lastUpdate);
  return ((now - updateTime)/60000 <=10) ? {text:"ONLINE", color:"green"} : {text:"OFFLINE", color:"red"};
}

function fetchData(sensor){
  const channelID = sensor.id;
  fetch(`https://api.thingspeak.com/channels/${channelID}/feeds.json?results=25`)
    .then(res => res.json())
    .then(data => {
      const latest = data.feeds[0];
      if(!latest) return;

      const lat = parseFloat(latest.field7);
      const lon = parseFloat(latest.field8);
      const pm1  = parseFloat(latest.field1);
      const pm25 = parseFloat(latest.field2);
      const pm10 = parseFloat(latest.field3);
      const lastUpdate = latest.created_at;
      const aqiData = calculateAQI(pm25);
      const status = getStatus(lastUpdate);

      if(!markers[channelID]){
        markers[channelID] = L.circleMarker([lat, lon], {
          radius:15, fillColor:aqiData.color, color:"#000", weight:1, fillOpacity:0.9
        }).addTo(map);

        markers[channelID].bindTooltip(sensor.name, { permanent:true, direction:"top", offset:[0,-10], className:"sensor-label" });
        bounds.push([lat, lon]);
        map.fitBounds(bounds, {padding:[50,50]});

        markers[channelID].bindPopup(getPopupHTML(channelID, sensor.name, channelID, status, pm1, pm25, pm10, aqiData));
        markers[channelID].on('popupopen', () => setupChart(channelID));
        markers[channelID].on('popupclose', () => { if(window[`chart_${channelID}`]) { window[`chart_${channelID}`].destroy(); delete window[`chart_${channelID}`]; } });
      } else {
        // Only update position and color, do NOT overwrite popup content
        markers[channelID].setLatLng([lat, lon]);
        markers[channelID].setStyle({fillColor:aqiData.color});
      }
    });
}

function getPopupHTML(channelID, name, id, status, pm1, pm25, pm10, aqiData){
  return `
    <div class="popup-flex">
      <div class="popup-details">
        <b>${name}</b>
        <b>Channel:</b> ${id}
        <b>Status:</b> <span style="color:${status.color}; font-weight:bold;">${status.text}</span>
        <b>PM1:</b> ${isNaN(pm1)?'N/A':pm1} µg/m³
        <b>PM2.5:</b> ${isNaN(pm25)?'N/A':pm25} µg/m³
        <b>PM10:</b> ${isNaN(pm10)?'N/A':pm10} µg/m³
        <b>AQI:</b> ${aqiData.aqi.toFixed(0)} (${aqiData.level})
      </div>
      <div class="popup-chart">
        <select id="time-range-${channelID}">
          <option value="1">1 Hour</option>
          <option value="24">24 Hours</option>
          <option value="168">7 Days</option>
        </select>
        <canvas id="chart-${channelID}" height="280"></canvas>
      </div>
    </div>
  `;
}

function setupChart(channelID){
  const selectEl = document.getElementById(`time-range-${channelID}`);
  loadChart(channelID, selectEl.value);
  const newSelect = selectEl.cloneNode(true);
  selectEl.replaceWith(newSelect);
  newSelect.addEventListener('change', e => loadChart(channelID, e.target.value));
}

function loadChart(channelID, hours){
  const results = Math.min(hours*4, 1000);
  fetch(`https://api.thingspeak.com/channels/${channelID}/feeds.json?results=${results}`)
    .then(res => res.json())
    .then(history => {
      if(!history.feeds || history.feeds.length===0) return;
      const labels = history.feeds.map(f => new Date(f.created_at).toLocaleString());
      const pm1Data  = history.feeds.map(f => parseFloat(f.field1)||0);
      const pm25Data = history.feeds.map(f => parseFloat(f.field2)||0);
      const pm10Data = history.feeds.map(f => parseFloat(f.field3)||0);
      const aqiData  = history.feeds.map(f => calculateAQI(parseFloat(f.field2)||0).aqi);

      const ctx = document.getElementById(`chart-${channelID}`).getContext('2d');
      if(window[`chart_${channelID}`]) window[`chart_${channelID}`].destroy();

      window[`chart_${channelID}`] = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets:[
          {
    label:'PM1',
    data: pm1Data,
    borderColor:'#3498db',
    backgroundColor:'transparent',
    fill:false,
    tension:0.3,
    pointRadius: 3,
    pointHoverRadius: 5,
    hidden: true
  },
  {
    label:'PM2.5',
    data: pm25Data,
    borderColor:'#e74c3c',
    backgroundColor:'transparent',
    fill:false,
    tension:0.3,
    pointRadius: 3,
    pointHoverRadius: 5,
    hidden: true
  },
  {
    label:'PM10',
    data: pm10Data,
    borderColor:'#f1c40f',
    backgroundColor:'transparent',
    fill:false,
    tension:0.3,
    pointRadius: 3,
    pointHoverRadius: 5,
    hidden: true
  },
  {
    label:'AQI',
    data: aqiData,
    borderColor:'#8e44ad',
    backgroundColor:'transparent',
    fill:false,
    yAxisID:'y1',
    pointRadius: 4,
    pointHoverRadius: 6
  }
]},
        options: {
          responsive:true,
          interaction:{mode:'index',intersect:false},
          stacked:false,
          plugins:{ legend:{ labels:{color:'black', font:{size:14}} } },
          scales:{
            x:{ display:true, title:{display:true,text:'Time',color:'black', font:{size:14,weight:'bold'}}, ticks:{color:'black', maxRotation:45, minRotation:45}, grid:{color:'rgba(0,0,0,0.1)'} },
            y:{ type:'linear', position:'left', display:true, title:{display:true,text:'PM Values (µg/m³)',color:'black', font:{size:14,weight:'bold'}}, ticks:{color:'black'}, grid:{color:'rgba(0,0,0,0.1)'}, beginAtZero:true },
            y1:{ type:'linear', position:'right', display:true, title:{display:true,text:'AQI',color:'black', font:{size:14,weight:'bold'}}, ticks:{color:'black'}, grid:{drawOnChartArea:false}, beginAtZero:true }
          }
        }
      });
    });
}

channels.forEach(sensor => fetchData(sensor));
setInterval(() => channels.forEach(sensor => fetchData(sensor)), 15000);
</script>
</body>
</html>
